name: RomanVoice
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: '3.0.0'
    CURRENT_PROJECT_VERSION: 1
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.19
targets:
  RomanVoice:
    type: application
    platform: iOS
    deploymentTarget: '18.0'
    sources:
      - path: RomanVoice
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.romanvoice.private.v3
        PRODUCT_NAME: RomanVoice
        INFOPLIST_FILE: RomanVoice/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: RomanVoice/RomanVoice-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: ZIPFoundation
      - framework: Vendor/llama.xcframework
        embed: true
      - sdk: Accelerate.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: libc++.tbd
  RomanVoiceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: RomanVoice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.romanvoice.private.v3.tests
        GENERATE_INFOPLIST_FILE: YES
  RomanVoiceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: RomanVoice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.romanvoice.private.v3.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RomanVoice
schemes:
  RomanVoice:
    build:
      targets:
        RomanVoice: all
        RomanVoiceTests: [test]
        RomanVoiceUITests: [test]
    test:
      targets:
        - RomanVoiceTests
        - RomanVoiceUITests
